name: Publish

# Push a tag `vX.Y.Z` whose version matches package.json → publish
# @lendwise/mcp@X.Y.Z to npm.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The tag names the version it releases: v0.1.5 publishes 0.1.5. The tag,
      # package.json and the VERSION the server reports to MCP clients
      # (src/core/server.ts) must all agree, or this fails before npm.
      - name: Check the tag matches the versions in the code
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if ! grep -q "^export const VERSION = '$version'$" src/core/server.ts; then
            echo "::error::src/core/server.ts VERSION is not '$version' (package.json): bump both"
            exit 1
          fi

      # OIDC trusted publishing: no registry-url/NODE_AUTH_TOKEN here on purpose.
      # Either defeats OIDC by forcing npm onto token auth instead (ENEEDAUTH).
      # npm also checks package.json `repository` against this repository for
      # the provenance it attaches.
      - run: npm install -g npm@latest # trusted publishing needs npm >=11.5.0

      # A version already on npm is skipped, so a re-run after a hand publish
      # or a half-failed release goes green instead of failing on E403.
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if out="$(npm view "$name@$version" version 2>&1)"; then
            if [ "$out" = "$version" ]; then
              echo "skip $name@$version (already on npm)"
              exit 0
            fi
          elif ! printf '%s' "$out" | grep -q E404; then
            echo "::error::npm view $name@$version failed: $out"
            exit 1
          fi
          npm publish --access public
