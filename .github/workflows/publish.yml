name: Publish

# Push a tag `vX.Y.Z` on a commit of main whose versions match → publish
# @lendwise/mcp@X.Y.Z to npm.
#
# Two jobs, so the credential to publish never meets third-party code:
#   build   — no permissions: install, typecheck, test, build, pack. Dependency
#             install scripts and tests run here, where there is nothing to steal.
#   publish — the only job with `id-token: write`. It runs no project code and
#             installs nothing from the project: it publishes the tarball
#             `build` produced, with lifecycle scripts disabled.
# Actions are pinned to commit SHAs and npm to an exact version: a moved tag
# upstream cannot change what runs next to the publish credential.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch with full history: origin/main for the check below
          persist-credentials: false

      # A tag publishes only what was merged: a tag pushed on a commit that is
      # not on main (a side branch, an unreviewed commit) fails here.
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: a release builds from the registry and the
      # lockfile's integrity hashes, never from a cache another run could have
      # written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The tag names the version it releases: v0.1.5 publishes 0.1.5. The tag,
      # package.json and the VERSION the server reports to MCP clients
      # (src/core/server.ts) must all agree.
      - name: Check the tag matches the versions in the code
        id: pkg
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if ! grep -q "^export const VERSION = '$version'$" src/core/server.ts; then
            echo "::error::src/core/server.ts VERSION is not '$version' (package.json): bump both"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The exact bytes that get published, built and tested above. Packed with
      # scripts off so no prepare/prepack hook can change dist/ after the tests.
      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts | tail -n 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub environment: protection rules (required reviewers, tag rules)
    # can be added to it in the repository settings, and npm's trusted
    # publisher can be bound to it.
    environment: npm
    permissions:
      id-token: write # OIDC trusted publishing; nothing else

    steps:
      # OIDC trusted publishing: no registry-url/NODE_AUTH_TOKEN here on purpose.
      # Either defeats OIDC by forcing npm onto token auth instead (ENEEDAUTH).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.0. Pinned, and installed without
      # running any install script.
      - run: npm install -g npm@12.2.0 --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # A version already on npm is skipped, so a re-run after a hand publish
      # or a half-failed release goes green instead of failing on E403.
      - name: Publish to npm
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          if out="$(npm view "$NAME@$VERSION" version 2>&1)"; then
            if [ "$out" = "$VERSION" ]; then
              echo "skip $NAME@$VERSION (already on npm)"
              exit 0
            fi
          elif ! printf '%s' "$out" | grep -q E404; then
            echo "::error::npm view $NAME@$VERSION failed: $out"
            exit 1
          fi
          npm publish "./$TARBALL" --access public --ignore-scripts
